name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# El CI solo necesita leer el codigo: instala, compila y corre pruebas. Sin
# este bloque, GitHub le da al token permisos de escritura por defecto, asi
# que una dependencia o accion comprometida podria empujar commits o tocar
# releases. Si algun job llega a necesitar mas (comentar en el PR, subir
# paquetes), se le declara aparte en ese job, no aca.
permissions:
  contents: read

# Empujar un commit nuevo cancela la corrida anterior de la misma rama/PR.
# Sin esto, tres pushes seguidos dejan tres CI compitiendo por los runners y
# el ultimo — el unico que importa — es el que mas tarda en arrancar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint y typecheck comparten instalacion y son rapidos; corren en paralelo
  # con los tests, que son el paso mas lento.
  static:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srgh-app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ">=22.13"
          cache: pnpm
          cache-dependency-path: srgh-app/pnpm-lock.yaml

      # Acelerador, no fuente de verdad: `pnpm install` corre igual despues y
      # corrige cualquier cache incompleto o corrupto.
      - name: Restore node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: srgh-app/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('srgh-app/pnpm-lock.yaml') }}

      # Caches incrementales de ESLint y TypeScript. La clave incluye el hash
      # del lockfile y de las configuraciones: si cambia una dependencia,
      # eslint.config.mjs o tsconfig.json, el cache se descarta entero en vez
      # de arrastrar resultados que ya no aplican. El sufijo con el SHA hace
      # que cada corrida guarde su propio cache y restore-keys recupere el
      # mas reciente de la misma configuracion.
      - name: Restore lint/typecheck caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            srgh-app/.eslintcache
            srgh-app/tsconfig.tsbuildinfo
          key: static-${{ runner.os }}-${{ hashFiles('srgh-app/pnpm-lock.yaml', 'srgh-app/eslint.config.mjs', 'srgh-app/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            static-${{ runner.os }}-${{ hashFiles('srgh-app/pnpm-lock.yaml', 'srgh-app/eslint.config.mjs', 'srgh-app/tsconfig.json') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # Los tests se reparten en shards que corren en paralelo: el paso pasa a
  # durar lo que el shard mas lento, no la suma. Vitest reparte los archivos
  # entre shards, asi que 1/2 + 2/2 cubre la suite completa.
  test:
    name: Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srgh-app
    strategy:
      # Un shard que falla no cancela al otro: asi el reporte muestra todos
      # los fallos de una vez en lugar de obligar a arreglar de a uno.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ">=22.13"
          cache: pnpm
          cache-dependency-path: srgh-app/pnpm-lock.yaml

      - name: Restore node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: srgh-app/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('srgh-app/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Sin `--` antes del flag: pnpm 11 se lo traga y vitest terminaria
      # corriendo la suite completa en cada shard (verificado: con `--` daba
      # 160 archivos por shard en vez de 80).
      - name: Test
        run: pnpm test --shard=${{ matrix.shard }}/2

  coverage:
    name: Coverage checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srgh-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      # Fijado en Node 22 LTS, no ">=22.13": con Node 24 (hasta 24.22.2) este
      # job abortaba al azar con "Check failed: jit_page.has_value()" (exit
      # 132) sin que fallara ningun test. Es un bug de V8 al liberar codigo
      # WebAssembly cuando se cierran worker threads (vitest usa pool
      # 'threads'): nodejs/node#66366 y #67556. El arreglo de V8 no esta
      # backporteado a 24.x y Node 22 no tiene el bug. Volver a ">=22.13"
      # cuando salga un 24.x con el backport (nodejs/node#66376).
      # `--no-wasm-code-gc` lo evita en 24, pero Node no lo acepta en
      # NODE_OPTIONS, y la cobertura v8 mide igual en 22.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: srgh-app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Enforce security and module coverage thresholds
        run: pnpm test:coverage:modules --maxWorkers=4
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports
          path: srgh-app/coverage
          retention-days: 14
          if-no-files-found: error

  # Las pruebas de navegador corren en serie (comparten datos dentro de cada
  # archivo), asi que el job duraba la suma de todas: era el mas lento del CI.
  # Se reparten en shards y cada uno levanta su propio Supabase: ninguno
  # comparte base con otro, y Playwright mantiene juntas y en orden las
  # pruebas de un mismo archivo.
  #
  # Por que 4: Playwright corta por archivo completo y en orden. Con 3, los
  # dos archivos mas pesados (brand-context y brands) caian juntos en el
  # shard 1 (30 de 54 pruebas, medido); con 4 queda cada uno solo. Mas no
  # rinde: el piso es el archivo mas grande (~100 s) mas los ~2.5 min fijos
  # de arranque de cada shard (Supabase, navegador, dependencias). Si la
  # suite crece, conviene volver a mirar el reparto en el log de cada shard.
  e2e:
    name: Browser & Supabase integration (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: srgh-app
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ">=22.13"
          cache: pnpm
          cache-dependency-path: srgh-app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare isolated Supabase project
        run: pnpm test:e2e:prepare
      # Los puertos del stack aislado (55420-55429) caen dentro del rango
      # efimero de Linux (32768-60999): una conexion saliente cualquiera, por
      # ejemplo al bajar imagenes, puede tomar uno justo antes de que Docker lo
      # publique, y el arranque falla con "address already in use" (paso en
      # dev con a0c5c30, puerto 55424). Reservarlos los saca del reparto
      # automatico sin impedir que Docker los use.
      - name: Reserve the isolated stack ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=55420-55429
      # Las imagenes de Supabase vienen de public.ecr.aws, que a veces corta
      # con "429 Too Many Requests" o "Data limit exceeded" cuando los cuatro
      # shards bajan lo mismo a la vez (en el PR #91 dos shards no llegaron a
      # arrancar). Se guardan en la cache de GitHub y se cargan antes de
      # `supabase start`, que no descarga lo que ya esta en el Docker local.
      # Las versiones de las imagenes las fija el CLI y la major de Postgres
      # sale de config.toml: esos dos van en la clave.
      - name: Resolve Supabase image cache key
        id: supabase-images
        run: |
          cli=$(pnpm exec supabase --version | tail -n 1 | tr -d '[:space:]')
          echo "key=supabase-images-${{ runner.os }}-$cli-${{ hashFiles('srgh-app/supabase/config.toml') }}" >> "$GITHUB_OUTPUT"
      - name: Restore Supabase images
        id: supabase-images-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/supabase-images.tar
          key: ${{ steps.supabase-images.outputs.key }}
      - name: Load Supabase images
        if: steps.supabase-images-cache.outputs.cache-hit == 'true'
        run: docker load --input ~/supabase-images.tar
      # Cada linea del log lleva la hora: sin eso no se distingue cuanto del
      # arranque es descarga de imagenes y cuanto migraciones. `pipefail` hace
      # que un fallo de `supabase start` siga tumbando el paso aunque su
      # salida pase por el bucle.
      - name: Start isolated services
        run: |
          set -o pipefail
          pnpm exec supabase start --workdir .e2e --exclude=studio --exclude=imgproxy --exclude=realtime --exclude=edge-runtime --exclude=vector --exclude=logflare 2>&1 \
            | while IFS= read -r line; do printf '%(%H:%M:%S)T %s\n' -1 "$line"; done > .e2e/start.log
          pnpm exec supabase status --workdir .e2e --output json > .e2e/connection.json
      # Solo un shard guarda: los cuatro compiten por la misma clave y los
      # demas solo dejarian un aviso de "unable to reserve cache".
      - name: Export Supabase images
        if: steps.supabase-images-cache.outputs.cache-hit != 'true' && matrix.shard == 1
        run: |
          images=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E '(^|/)supabase/' | sort -u || true)
          if [ -z "$images" ]; then
            echo "::warning::No Supabase images found to cache."
            exit 0
          fi
          echo "$images"
          # shellcheck disable=SC2086  # one argument per image.
          docker save --output ~/supabase-images.tar $images
      - name: Save Supabase images
        if: steps.supabase-images-cache.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/supabase-images.tar
          key: ${{ steps.supabase-images.outputs.key }}
      # El binario de Chromium se cachea; la clave cambia con el lockfile, que
      # es donde queda fijada la version de Playwright.
      - name: Restore test browser
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('srgh-app/pnpm-lock.yaml') }}
      - name: Install test browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # Con el binario en cache igual hacen falta las librerias del sistema:
      # esas viven fuera del cache.
      - name: Install test browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Sin `--` antes del flag, igual que en los tests unitarios: pnpm 11 se
      # lo traga y cada shard correria la suite completa.
      - name: Browser and HTTP integration tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      # start.log va incluido para poder ver en que se va el arranque de
      # Supabase (descarga de imagenes vs. migraciones).
      - name: Publish browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-report-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            srgh-app/playwright-report
            srgh-app/test-results
            srgh-app/.e2e/start.log
          retention-days: 14
          if-no-files-found: warn
      # Sin paso de `supabase stop`: el runner de GitHub se destruye al
      # terminar el job y apagar los contenedores costaba ~12 s por shard. En
      # local si hace falta (ver tests/e2e/README.md), y habria que volver a
      # ponerlo si algun dia se usan runners propios.

  # Compila la app. Atrapa lo que lint, typecheck y tests
  # no ven: limites Server/Client mal puestos, imports que solo revientan al
  # empaquetar, rutas que no prerenderizan.
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srgh-app
    env:
      # Solo las NEXT_PUBLIC_*: son las unicas que Next incrusta en el bundle
      # durante el build. Las de servidor (SUPABASE_SECRET_KEY,
      # FACE_VECTOR_KEY, FACE_TICKET_SECRET) se leen dentro de funciones en
      # runtime — pasarlas aca solo ampliaria la superficie de exposicion sin
      # que el build las use.
      #
      # Se usan los secrets reales si existen, con respaldo ficticio si no:
      #   - Con los reales, el build ademas valida que esten bien formados
      #     (src/lib/env.ts exige URL valida y string no vacio al importarse).
      #   - El respaldo evita que el CI se caiga por un secret renombrado,
      #     rotado, o por un PR desde un fork (los forks no reciben secrets).
      # Verificado: el build compila igual sin ningun .env, porque no consulta
      # Supabase — todas las rutas salen dinamicas, nada se prerenderiza.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'dummy_key_for_build' }}
      NEXT_PUBLIC_FACE_VECTOR_KEY: ${{ secrets.NEXT_PUBLIC_FACE_VECTOR_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ">=22.13"
          cache: pnpm
          cache-dependency-path: srgh-app/pnpm-lock.yaml

      - name: Restore node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: srgh-app/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('srgh-app/pnpm-lock.yaml') }}

      # Cache de compilacion de Next: pesa poco (~350 KB) y bajo la
      # compilacion de 20.4s a 9.9s en la medicion local.
      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: srgh-app/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('srgh-app/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('srgh-app/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm build

  # Compuerta unica para la proteccion de rama: en vez de exigir cada job y
  # cada shard por separado (y tener que actualizar esa lista al cambiar la
  # cantidad de shards), la regla de `dev` exige solo este check.
  ci:
    name: CI passed
    if: always()
    needs: [static, test, coverage, e2e, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "static: ${{ needs.static.result }}"
          echo "test:   ${{ needs.test.result }}"
          echo "coverage: ${{ needs.coverage.result }}"
          echo "e2e: ${{ needs.e2e.result }}"
          echo "build:  ${{ needs.build.result }}"
          if [ "${{ needs.static.result }}" != "success" ] \
            || [ "${{ needs.test.result }}" != "success" ] \
            || [ "${{ needs.coverage.result }}" != "success" ] \
            || [ "${{ needs.e2e.result }}" != "success" ] \
            || [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Algun job del CI no paso."
            exit 1
          fi
          echo "Todo en verde."
